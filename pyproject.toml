[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shinderera-birthday-notifier"
version = "0.1.0"
description = "誕生日通知アプリ"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "shinderera" } ]
dependencies = [
    "win10toast>=0.9"
]

[project.scripts]
birthday-notifier = "birthday_notifier:main"
